name: Docs

on:
  push:
    branches: ['main']
    paths:
      - packages/docs/**
      - bun.lock
  pull_request:
    paths:
      - packages/docs/**
      - bun.lock

permissions:
  contents: read

jobs:
  mint:
    name: Mintlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
      # The root postinstall compiles the Tauri CLI from git; the docs only need
      # the mint CLI, which ships as plain JavaScript.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate docs
        working-directory: packages/docs
        run: bunx mint validate
      - name: Check links
        working-directory: packages/docs
        run: bunx mint broken-links
