name: Build

on:
  push:
    branches: ['main']
    # Paths that cannot change a build input; both triggers share the list.
    paths-ignore: &code-irrelevant
      - '**.md'
      - 'packages/docs/**'
      - '.github/release-please/**'
  pull_request:
    paths-ignore: *code-irrelevant

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS is deliberately absent: this fork cannot sign Apple binaries
        # (release.yml has no Developer certificate secrets), and the current
        # macos-latest image ships an Xcode SDK that cannot link
        # `cargo install tauri-cli` during `bun install` (libmacho.tbd, errno=22).
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install --no-install-recommends \
            libgtk-4-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-app-${{ matrix.os }}
          # The ARM leg measured 14.3-21.4 min with or without its entry, so
          # the ~3.9 GB it saved warmed nothing and is what evicted the
          # Windows entry. It still restores, but never saves.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.os != 'ubuntu-24.04-arm' }}
          # A lockfile hash in the key made every dependency bump save another
          # multi-gigabyte entry; the 10 GB budget then evicted the Windows one,
          # which is why its legs always started cold. One stable key per runner
          # keeps the newest target and lets cargo recompile what changed.
          add-rust-environment-hash-key: false
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ matrix.os }}-bun-${{ hashFiles('**/bun.lock') }}
          # A lockfile change must still restore the previous store, otherwise
          # `bun install` re-downloads everything (7-11 min on Windows).
          restore-keys: ${{ matrix.os }}-bun-
      - run: bun install
      - run: bun run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: koharu-${{ matrix.os }}
          path: |
            target/release/koharu*
          retention-days: 3
