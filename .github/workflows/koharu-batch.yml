name: koharu-batch

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/koharu-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows release
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-batch
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build koharu-batch (release)
        run: cargo build --release --locked -p koharu-pipeline --bin koharu-batch
      - name: Smoke test
        run: |
          ./target/release/koharu-batch.exe --list-models
          ./target/release/koharu-batch.exe --input crates/koharu-ml/benches/fixtures/object_detection --output ${{ runner.temp }}/koharu-dry-run --dry-run --no-calibration --vram-budget-mib 8192
      - name: Smoke test (volume mode)
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}/koharu-volume/ch1" | Out-Null
          Copy-Item "crates/koharu-ml/benches/fixtures/object_detection/1.jpg" "${{ runner.temp }}/koharu-volume/ch1/page1.jpg"
          ./target/release/koharu-batch.exe --input "${{ runner.temp }}/koharu-volume" --output "${{ runner.temp }}/koharu-volume-out" --json "${{ runner.temp }}/koharu-volume-out/plan.json" --dry-run --no-calibration --vram-budget-mib 8192
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: koharu-batch-windows-x64
          path: target/release/koharu-batch.exe
          retention-days: 14
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/koharu-batch.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
