name: koharu-batch

on:
  push:
    branches: ['main']
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/koharu-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Mirrors crates/koharu-runtime/src/runtime/packages/llama.rs RELEASE: the
  # --prune smoke test keeps exactly this directory in the fake store.
  LLAMA_RELEASE: b10903

jobs:
  windows:
    name: Windows release
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Anti-calibration guard (semantic mutant)
        run: bun scripts/check-calibration-guard.ts
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: koharu-batch
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build koharu-batch (release)
        run: cargo build --release --locked -p koharu-pipeline --bin koharu-batch
      - name: Smoke test
        run: |
          ./target/release/koharu-batch.exe --list-models
          ./target/release/koharu-batch.exe --input crates/koharu-ml/benches/fixtures/object_detection --output ${{ runner.temp }}/koharu-dry-run --dry-run --no-calibration --vram-budget-mib 8192
      - name: Smoke test (volume mode)
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}/koharu-volume/ch1" | Out-Null
          Copy-Item "crates/koharu-ml/benches/fixtures/object_detection/1.jpg" "${{ runner.temp }}/koharu-volume/ch1/page1.jpg"
          New-Item -ItemType Directory -Force "${{ runner.temp }}/koharu-volume/Vol/Ch2" | Out-Null
          Copy-Item "crates/koharu-ml/benches/fixtures/object_detection/1.jpg" "${{ runner.temp }}/koharu-volume/Vol/Ch2/page1.jpg"
          ./target/release/koharu-batch.exe --input "${{ runner.temp }}/koharu-volume" --output "${{ runner.temp }}/koharu-volume-out" --json "${{ runner.temp }}/koharu-volume-out/plan.json" --dry-run --no-calibration --vram-budget-mib 8192
          $plan = Get-Content "${{ runner.temp }}/koharu-volume-out/plan.json" | ConvertFrom-Json
          if ($plan.chapters.Count -ne 2 -or $plan.chapters[0].label -ne 'ch1' -or $plan.chapters[1].label -ne 'Vol/Ch2') {
            throw "nested volume detection failed: $($plan.chapters.label -join ', ')"
          }
      - name: Smoke test (bench-cross --plan)
        shell: bash
        run: |
          bun scripts/bench-cross.ts \
            --before target/release/koharu-batch.exe \
            --after target/release/koharu-batch.exe \
            --input crates/koharu-ml/benches/fixtures/object_detection \
            --plan -- --vram-budget-mib 8192
      - name: Smoke test (--prune on a fake store)
        shell: pwsh
        run: |
          $store = "${{ runner.temp }}/koharu-prune-store"
          New-Item -ItemType Directory -Force "$store/hugging-face/models/unsloth--gemma-4-E4B-it-qat-GGUF/snapshots/rev" | Out-Null
          New-Item -ItemType Directory -Force "$store/hugging-face/models/someone--removed-model/snapshots/rev" | Out-Null
          New-Item -ItemType Directory -Force "$store/hugging-face/datasets/mayocream--fonts" | Out-Null
          New-Item -ItemType Directory -Force "$store/hugging-face/datasets/old--fonts" | Out-Null
          New-Item -ItemType Directory -Force "$store/llama/${{ env.LLAMA_RELEASE }}" | Out-Null
          New-Item -ItemType Directory -Force "$store/llama/b-old" | Out-Null
          foreach ($dir in @(
              "$store/hugging-face/models/unsloth--gemma-4-E4B-it-qat-GGUF/snapshots/rev",
              "$store/hugging-face/models/someone--removed-model/snapshots/rev",
              "$store/llama/b-old"
            )) {
            Set-Content "$dir/blob.bin" (1..1024)
          }
          # Listing reports exactly the three orphans and never deletes.
          $list = ./target/release/koharu-batch.exe --prune --store "$store"
          $list | Out-Host
          foreach ($needle in @(
            'someone--removed-model', 'old--fonts', 'b-old'
          )) {
            if (-not ($list | Select-String -SimpleMatch $needle)) {
              throw "--prune listing misses $needle"
            }
          }
          foreach ($kept in @(
            'unsloth--gemma-4-E4B-it-qat-GGUF',
            'mayocream--fonts',
            'b10903'
          )) {
            if ($list | Select-String -SimpleMatch $kept) {
              throw "--prune lists the referenced $kept"
            }
          }
          # Deletion removes the orphans and nothing else.
          ./target/release/koharu-batch.exe --prune --prune-delete --store "$store" | Out-Host
          if (Test-Path "$store/hugging-face/models/someone--removed-model") { throw "orphan model survived --prune-delete" }
          if (Test-Path "$store/hugging-face/datasets/old--fonts") { throw "orphan dataset survived --prune-delete" }
          if (Test-Path "$store/llama/b-old") { throw "stale runtime survived --prune-delete" }
          $keptPaths = @(
            "$store/hugging-face/models/unsloth--gemma-4-E4B-it-qat-GGUF",
            "$store/hugging-face/datasets/mayocream--fonts",
            "$store/llama/${{ env.LLAMA_RELEASE }}"
          )
          foreach ($kept in $keptPaths) {
            if (-not (Test-Path $kept)) { throw "referenced $kept was deleted" }
          }
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: koharu-batch-windows-x64
          path: target/release/koharu-batch.exe
          retention-days: 14
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/koharu-batch.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
