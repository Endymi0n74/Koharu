name: Test

on:
  push:
    branches: ['main']
    # Paths that cannot change a build input; both triggers share the list.
    paths-ignore: &code-irrelevant
      - '**.md'
      - 'packages/docs/**'
      - '.github/release-please/**'
  pull_request:
    paths-ignore: *code-irrelevant

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt update
          sudo apt install --no-install-recommends \
            libgtk-4-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            fonts-noto-cjk \
            dbus-x11 \
            gnome-keyring
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # Stable key, as in build.yml: a lockfile hash saved a new entry on
          # every bump and the 10 GB budget evicted this one. It keeps its own
          # key rather than build.yml's, since these artifacts are the debug
          # profile and must not be merged into the release cache.
          add-rust-environment-hash-key: false
      - name: Run headless Rust tests
        run: |
          cargo test --workspace --tests

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Run headless Vitest suite
        run: bun run --filter @koharu/app test
      - name: Run script unit tests (bench-cross)
        run: bun test scripts/
